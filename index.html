<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oś czasu – trasy i pobyty</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f5bd3">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1b1f24;--mut:#5d6470;--line:#e1e4e9;--acc:#2f5bd3;
--walk:#2e9e5b;--run:#e07a1f;--bike:#1f9fb4;--drive:#4a63d6;--stay:#6b7280;--gap:#b9bec6}
@media (prefers-color-scheme:dark){:root{--bg:#101317;--card:#1a1e24;--fg:#e8ebef;--mut:#9aa3ae;--line:#2b313a;--acc:#7a9bff;--stay:#9aa0a8;--gap:#4a5059}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:12px 10px 70px}
h1{font-size:20px;margin:2px 0}
h2{font-size:16px;margin:4px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
button,.btn,select,input,textarea{font:inherit;color:inherit}
button,.btn{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer}
button.pri,.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:4px 9px;font-size:13px}
button:disabled{opacity:.45}
select,input[type=number],input[type=text],textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 8px}
input[type=file]{display:none}
.note{font-size:13px;color:var(--mut)}
.msg{font-size:13px;padding:8px 10px;border-radius:9px;background:color-mix(in srgb,var(--acc) 12%,transparent);margin:8px 0 0;display:none}
.msg.on{display:block}.msg.err{background:color-mix(in srgb,#d33 16%,transparent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tile .k{color:var(--mut);font-size:12px}.tile .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}.tile .s{color:var(--mut);font-size:12px}
#map{height:62vh;min-height:320px;border-radius:10px;border:1px solid var(--line)}
.legend{display:flex;gap:4px 10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:8px}
.sw{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:4px;vertical-align:middle}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:middle;border:2px solid #fff;box-shadow:0 0 0 1px #0004}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:70px 6px 1fr;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.tl>li:last-child{border-bottom:0}
.tl>li.sel{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.tl .tm{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px;line-height:1.3}
.tl .bar{border-radius:3px}
.tl .ti{font-weight:600}
.tl .de{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.tl .ad{font-size:14px}
.tl .ev{font-size:13px;margin-top:2px}
.tl .act{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:2000}
.dlg.on{display:flex}
.dlg .box{background:var(--card);border-radius:14px 14px 0 0;width:100%;max-width:600px;padding:16px;max-height:90vh;overflow:auto}
.dlg label.f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0}
.dlg input[type=number]{width:100px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:right}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.play{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.play input[type=range]{flex:1;min-width:160px}
.badge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--mut)}
.help li{margin:5px 0}
.leaflet-popup-content{font:13px/1.4 system-ui,sans-serif}
.lbl{background:#fff;border:1px solid #555;border-radius:10px;padding:0 5px;font:600 11px system-ui;color:#222;white-space:nowrap}
svg{display:block;width:100%;height:auto}
.axis{font-size:24px;fill:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.cw{font-size:12px;color:var(--mut);text-align:center}
.cd{min-height:58px;border:1px solid var(--line);border-radius:8px;padding:3px 4px;font-size:12px}
.cd.has{cursor:pointer;background:color-mix(in srgb,var(--acc) 7%,transparent)}
.cd.today{outline:2px solid var(--acc)}
.cn{font-weight:600}.ck{font-variant-numeric:tabular-nums;color:var(--mut);font-size:11px}
.cb{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:3px}
.pill{display:inline-block;color:#fff;font-size:11px;font-weight:700;letter-spacing:.03em;padding:1px 7px;border-radius:9px;vertical-align:1px}
.num{display:inline-block;min-width:22px;height:22px;line-height:22px;border-radius:11px;background:#1c3d7a;color:#fff;font:700 13px system-ui;text-align:center;padding:0 4px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5);vertical-align:1px}
.numg{display:flex;gap:2px;white-space:nowrap}
.call.sm{display:inline-block;width:18px;height:18px;font-size:10px;line-height:15px;vertical-align:middle;border-width:1px}.cl1{cursor:pointer;white-space:nowrap;margin-right:8px}
.call{width:24px;height:24px;border-radius:50%;border:2px solid #000;color:#fff;font-size:13px;line-height:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.5)}
</style>
</head>
<body>
<main>
  <div class="row"><h1 class="grow">Oś czasu</h1><span id="store" class="note"></span></div>
  <div class="card">
    <div class="row">
      <label class="btn pri" for="file">Importuj</label>
      <input id="file" type="file" multiple accept=".gpx,.csv,.fit,.zip,.kml,.txt">
      <button id="bDrv">Dysk Google</button>
      <button id="bSum">Kalendarz</button>
      <button id="bFind">Szukaj</button>
      <button id="bPlaces">Miejsca</button>
      <button id="bSet">Ustawienia</button>
      <button id="bBak">Kopia</button>
      <button id="bHelp">Instrukcja</button>
      <button id="bDrvSet" class="sm">⚙ Dysk</button>
    </div>
    <div id="drvInfo" class="note" style="margin-top:6px"></div>
    <div id="msg" class="msg"></div>
  </div>

  <div id="dayBar" class="card" style="display:none">
    <div class="row">
      <button id="prev" aria-label="Poprzedni dzień">◀</button>
      <select id="daySel" class="grow"></select>
      <button id="next" aria-label="Następny dzień">▶</button>
    </div>
  </div>

  <div id="view"></div>
  <div id="sumView" style="display:none"></div>

  <div id="empty" class="card">
    <h2>Brak danych</h2>
    <p class="note">Ślad nagrywa w tle GPS Logger (telefon) i zegarek Garmin. Tutaj importuje się pliki i analizuje dzień. Ustawienia nagrywania – przycisk „Instrukcja”.</p>
  </div>
</main>

<!-- dialogi -->
<div id="dlg" class="dlg" role="dialog" aria-modal="true"><div class="box" id="dlgBox"></div></div>
<script>
"use strict";
/* ================= narzędzia ================= */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const fmtT=ms=>{const d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes());};
const fmtTs=ms=>{const d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());};
const fmtDur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return h?h+" h "+pad(m)+" min":(m?m+" min "+pad(x)+" s":x+" s");};
const nf0=new Intl.NumberFormat("pl-PL",{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat("pl-PL",{maximumFractionDigits:1,minimumFractionDigits:1});
const nf2=new Intl.NumberFormat("pl-PL",{maximumFractionDigits:2,minimumFractionDigits:2});
const fmtKm=m=>(m>=10000?nf1.format(m/1000):nf2.format(m/1000))+" km";
const fmtV=v=>(v==null||!isFinite(v))?"—":nf0.format(v)+" km/h";
const dateKey=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const dayLabel=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("pl-PL",{weekday:"short",day:"numeric",month:"long",year:"numeric"});};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R2D=180/Math.PI, D2R=Math.PI/180;
function hav(a,b,c,d){const R=6371008.8,dl=(c-a)*D2R,dn=(d-b)*D2R;const x=Math.sin(dl/2)**2+Math.cos(a*D2R)*Math.cos(c*D2R)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));}
function bearing(a,b,c,d){const y=Math.sin((d-b)*D2R)*Math.cos(c*D2R),x=Math.cos(a*D2R)*Math.sin(c*D2R)-Math.sin(a*D2R)*Math.cos(c*D2R)*Math.cos((d-b)*D2R);return Math.atan2(y,x);}
function wrapPi(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}
function median(a){if(!a.length)return null;const s=Float64Array.from(a).sort();return s.length%2?s[s.length>>1]:(s[s.length/2-1]+s[s.length/2])/2;}
function msg(t,err){const m=$("msg");m.textContent=t||"";m.className="msg"+(t?" on":"")+(err?" err":"");}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function download(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type:type||"text/plain"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}

/* ================= ustawienia ================= */
const DEF={acc:20,rad:50,stay:3,haltV:1.5,walk:7,run:14,min:60,
  brake:11.27,accel:12.87,evMin:24.1,corner:3.9,high:130,interval:"auto"};
let S=Object.assign({},DEF);
try{const s=JSON.parse(localStorage.getItem("osczasu-set")||"null");if(s)Object.assign(S,s);}catch(e){}
function saveSet(){try{localStorage.setItem("osczasu-set",JSON.stringify(S));}catch(e){}}

/* skala kolorów prędkości (km/h) */
const VBINS=[7,20,50,70,90,120,140];
const VCOL=["#9aa0a6","#2f7ef7","#1fa34a","#f2c200","#f28c00","#e02020","#8b1a1a","#8e24aa"];
const VLBL=["0–7","7–20","20–50","50–70","70–90","90–120","120–140","> 140"];
const vbin=v=>{let i=0;while(i<VBINS.length&&v>=VBINS[i])i++;return i;};
const CLS={stay:{n:"Pobyt",v:"--stay"},walk:{n:"Chód",v:"--walk"},run:{n:"Bieg",v:"--run"},bike:{n:"Rower",v:"--bike"},
  drive:{n:"Jazda",v:"--drive"},halt:{n:"Zatrzymanie",v:"--stay"},gap:{n:"Brak danych",v:"--gap"}};
const MOVING=["walk","run","bike","drive","halt"];
const ccol=c=>getComputedStyle(document.documentElement).getPropertyValue(CLS[c].v).trim()||"#888";
const EVC={brake:"#e01010",accel:"#ff8a00",corner:"#f5d000"};
const EVN={brake:"Gwałtowne hamowanie",accel:"Gwałtowne przyspieszenie",corner:"Ostry zakręt"};

/* ================= parsery ================= */
const num=x=>{const v=typeof x==="string"?parseFloat(x.replace(",",".")):x;return(typeof v==="number"&&isFinite(v))?v:null;};
function tms(x){if(x==null||x==="")return null;if(typeof x==="number")return x>1e12?x:x*1000;
  const s=String(x).trim();if(/^\d{12,}$/.test(s))return +s;if(/^\d{9,11}(\.\d+)?$/.test(s))return Math.round(+s*1000);
  const t=Date.parse(s);return isNaN(t)?null:t;}
/* punkt: {t, lat, lon, sp(km/h|null), acc(m|null), hr|null, ele|null} */
function parseGPX(txt){
  const doc=new DOMParser().parseFromString(txt,"application/xml");
  if(doc.getElementsByTagName("parsererror").length)throw new Error("niepoprawny GPX");
  const creator=(doc.documentElement.getAttribute("creator")||"");
  const watch=/garmin|connect|fenix|instinct|forerunner/i.test(creator);
  const out=[];
  const g=(e,n)=>{const x=e.getElementsByTagNameNS("*",n)[0];return x?x.textContent.trim():null;};
  for(const e of doc.getElementsByTagNameNS("*","trkpt")){
    const lat=num(e.getAttribute("lat")),lon=num(e.getAttribute("lon")),t=tms(g(e,"time"));
    if(lat==null||lon==null||t==null)continue;
    const src=(g(e,"src")||"").toLowerCase(); if(src&&src!=="gps")continue; /* odrzuć pozycje sieciowe */
    const sp=num(g(e,"speed")),hd=num(g(e,"hdop")),ac=num(g(e,"accuracy"));
    out.push({t,lat,lon,sp:sp!=null&&sp>=0?sp*3.6:null,acc:ac!=null?ac:(hd!=null?hd*5:null),hr:num(g(e,"hr")),ele:num(g(e,"ele"))});
  }
  return {pts:out,src:watch?"watch":"phone"};
}
function parseCSV(txt){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return{pts:[],src:"phone"};
  const h0=lines[0];const sep=(h0.match(/;/g)||[]).length>(h0.match(/,/g)||[]).length?";":(h0.includes("\t")?"\t":",");
  const H=h0.split(sep).map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
  const ix=(...n)=>{for(const x of n){const i=H.indexOf(x);if(i>=0)return i;}return -1;};
  const iTs=ix("timestamp_ms"),iT=ix("time","timestamp","date time","datetime","czas","date"),
        iLa=ix("lat","latitude"),iLo=ix("lon","lng","longitude"),iSp=ix("speed","speed(m/s)"),iAc=ix("accuracy","accuracy(m)","acc"),
        iPr=ix("provider"),iEl=ix("elevation","altitude","ele");
  if((iT<0&&iTs<0)||iLa<0||iLo<0)throw new Error("CSV bez kolumn time/lat/lon");
  const out=[];
  for(let i=1;i<lines.length;i++){const c=lines[i].split(sep).map(x=>x.trim().replace(/^"|"$/g,""));
    const t=iTs>=0&&c[iTs]?tms(c[iTs]):tms(c[iT]);const lat=num(c[iLa]),lon=num(c[iLo]);
    if(t==null||lat==null||lon==null)continue;
    if(iPr>=0&&c[iPr]&&c[iPr].toLowerCase()!=="gps")continue;
    const sp=iSp>=0?num(c[iSp]):null;
    out.push({t,lat,lon,sp:sp!=null&&sp>=0?sp*3.6:null,acc:iAc>=0?num(c[iAc]):null,hr:null,ele:iEl>=0?num(c[iEl]):null});}
  return {pts:out,src:"phone"};
}
function parseKML(txt){
  const doc=new DOMParser().parseFromString(txt,"application/xml");const out=[];
  for(const tr of doc.getElementsByTagNameNS("*","Track")){
    const w=[...tr.getElementsByTagNameNS("*","when")],c=[...tr.getElementsByTagNameNS("*","coord")];
    for(let i=0;i<Math.min(w.length,c.length);i++){const t=tms(w[i].textContent),p=c[i].textContent.trim().split(/\s+/).map(Number);
      if(t!=null&&isFinite(p[0])&&isFinite(p[1]))out.push({t,lat:p[1],lon:p[0],sp:null,acc:null,hr:null,ele:p[2]||null});}}
  return {pts:out,src:"phone"};
}
/* FIT (Garmin): komunikaty record (nr 20) */
function parseFIT(buf){
  const dv=new DataView(buf);const out=[];let pos=0;let lastTs=null;
  while(pos+12<=buf.byteLength){
    const hs=dv.getUint8(pos),ds=dv.getUint32(pos+4,true);
    if(String.fromCharCode(dv.getUint8(pos+8),dv.getUint8(pos+9),dv.getUint8(pos+10),dv.getUint8(pos+11))!==".FIT")break;
    let p=pos+hs;const end=p+ds;const defs={};
    while(p<end){
      const h=dv.getUint8(p++);
      if(h&0x80){const lt=(h>>5)&3,off=h&0x1f;const d=defs[lt];if(!d)throw new Error("FIT: brak definicji");
        let ts=null;if(lastTs!=null){ts=(lastTs&~0x1f)+off;if(off<(lastTs&0x1f))ts+=0x20;lastTs=ts;}
        p=readMsg(d,p,ts);continue;}
      if(h&0x40){const lt=h&0x0f,dev=h&0x20;p++;const arch=dv.getUint8(p++);const le=arch===0;
        const gn=dv.getUint16(p,le);p+=2;const nf=dv.getUint8(p++);const f=[];
        for(let i=0;i<nf;i++){f.push({n:dv.getUint8(p),s:dv.getUint8(p+1),b:dv.getUint8(p+2)});p+=3;}
        let devSize=0;if(dev){const nd=dv.getUint8(p++);for(let i=0;i<nd;i++){devSize+=dv.getUint8(p+1);p+=3;}}
        defs[lt]={le,gn,f,devSize};continue;}
      const d=defs[h&0x0f];if(!d)throw new Error("FIT: brak definicji");p=readMsg(d,p,null);
    }
    pos=end+2;
  }
  function rd(p,s,signed,le){
    if(s===1)return signed?dv.getInt8(p):dv.getUint8(p);
    if(s===2)return signed?dv.getInt16(p,le):dv.getUint16(p,le);
    if(s===4)return signed?dv.getInt32(p,le):dv.getUint32(p,le);
    return null;}
  function readMsg(d,p,cts){
    if(d.gn!==20){for(const f of d.f)p+=f.s;return p+d.devSize;}
    const r={};
    for(const f of d.f){const signed=f.n===0||f.n===1;r[f.n]=rd(p,f.s,signed,d.le);p+=f.s;}
    p+=d.devSize;
    let ts=r[253]!=null&&r[253]!==0xffffffff?r[253]:cts;
    if(r[253]!=null&&r[253]!==0xffffffff)lastTs=r[253];
    const la=r[0],lo=r[1];
    if(ts!=null&&la!=null&&lo!=null&&la!==0x7fffffff&&lo!==0x7fffffff){
      const sc=180/2147483648;
      let sp=r[73]!=null&&r[73]!==0xffffffff?r[73]/1000:(r[6]!=null&&r[6]!==0xffff?r[6]/1000:null);
      let ele=r[78]!=null&&r[78]!==0xffffffff?r[78]/5-500:(r[2]!=null&&r[2]!==0xffff?r[2]/5-500:null);
      out.push({t:(ts+631065600)*1000,lat:la*sc,lon:lo*sc,sp:sp!=null?sp*3.6:null,acc:null,
        hr:r[3]!=null&&r[3]!==0xff?r[3]:null,ele});
    }
    return p;}
  return {pts:out,src:"watch"};
}
/* ZIP (eksport z Garmin Connect) */
async function unzip(buf){
  const dv=new DataView(buf);let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break;}
  if(e<0)throw new Error("niepoprawny ZIP");
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files=[];
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const meth=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(new Uint8Array(buf,p+46,nl));p+=46+nl+xl+cl;
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);const raw=new Uint8Array(buf,ds,cs);
    let data;if(meth===0)data=raw.slice().buffer;
    else if(meth===8){const st=new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));data=await new Response(st).arrayBuffer();}
    else continue;
    files.push({name,data});
  }
  return files;
}
async function parseFile(name,buf){
  name=name.toLowerCase();
  if(name.endsWith(".zip")){const fs=await unzip(buf);const r=[];for(const f of fs)r.push(...await parseFile(f.name,f.data));return r;}
  const u8=new Uint8Array(buf,0,Math.min(12,buf.byteLength));
  if(name.endsWith(".fit")||(u8.length>=12&&String.fromCharCode(u8[8],u8[9],u8[10],u8[11])===".FIT"))return[parseFIT(buf)];
  const txt=new TextDecoder().decode(buf);
  if(/<gpx/i.test(txt.slice(0,3000)))return[parseGPX(txt)];
  if(/<kml/i.test(txt.slice(0,3000)))return[parseKML(txt)];

function toCols(pts){const n=pts.length,c={t:new Float64Array(n),lat:new Float64Array(n),lon:new Float64Array(n),

/* scalanie: w okresach nagrywania zegarka używany jest zegarek (odbiornik wielopasmowy), poza nimi telefon */
function buildTrack(d){
  const W=fromCols(d.watch,"watch"),Ph=fromCols(d.phone,"phone");
  if(!W.length)return Ph;if(!Ph.length)return W;
  const iv=[];let s=0;for(let i=1;i<=W.length;i++){if(i===W.length||W[i].t-W[i-1].t>60000){iv.push([W[s].t-1000,W[i-1].t+1000]);s=i;}}
  let k=0;const keep=[];for(const p of Ph){while(k<iv.length&&iv[k][1]<p.t)k++;if(k<iv.length&&p.t>=iv[k][0]&&p.t<=iv[k][1])continue;keep.push(p);}
  return keep.concat(W).sort((a,b)=>a.t-b.t);
}
function filterPts(P){
  const u=[];let dropAcc=0,dropJump=0;
  for(const p of P){
    if(p.acc!=null&&p.acc>S.acc){dropAcc++;continue;}
    const L=u[u.length-1];
    if(L){const dt=(p.t-L.t)/1000;if(dt<0.3)continue;const v=hav(L.lat,L.lon,p.lat,p.lon)/dt*3.6;
      if(dt<120&&v>250&&!(p.sp!=null&&p.sp>200)){dropJump++;continue;}}
    u.push(p);}
  return {P:u,dropAcc,dropJump};
}
/* prędkość: Doppler z odbiornika, a gdy brak – z przemieszczenia w oknie ±10 s; kolor i maksimum z mediany 3 pomiarów */
function speeds(P){
  const n=P.length,W=10000,G=60000;let j=0,k=0;
  for(let i=0;i<n;i++){
    if(P[i].sp!=null){P[i].vr=P[i].sp;P[i].dop=true;continue;}
    P[i].dop=false;
    if(j>i)j=i;while(j<i&&(P[i].t-P[j].t>W||P[j+1].t-P[j].t>G))j++;
    if(k<i)k=i;while(k+1<n&&P[k+1].t-P[i].t<=W&&P[k+1].t-P[k].t<=G)k++;while(k>i&&P[k].t-P[i].t>W)k--;
    let a=j,b=k;if(a===b){if(i>0&&P[i].t-P[i-1].t<=G)a=i-1;else if(i+1<n&&P[i+1].t-P[i].t<=G)b=i+1;}
    const dt=(P[b].t-P[a].t)/1000;P[i].vr=dt>0?hav(P[a].lat,P[a].lon,P[b].lat,P[b].lon)/dt*3.6:0;}
  for(let i=0;i<n;i++){const w=[P[i].vr];if(i>0&&P[i].t-P[i-1].t<=3000)w.push(P[i-1].vr);if(i+1<n&&P[i+1].t-P[i].t<=3000)w.push(P[i+1].vr);
    w.sort((x,y)=>x-y);P[i].v=w.length===2?(w[0]+w[1])/2:w[w.length>>1];}
}
/* pobyty: punkty w promieniu R od bieżącego środka skupiska przez co najmniej S.stay min (luki w danych w środku są wliczane) */
function findStays(P){
  const n=P.length,R=S.rad,T=S.stay*60000,lab=new Int32Array(n).fill(-1),stays=[];let i=0;
  while(i<n){
    let sl=P[i].lat,so=P[i].lon,c=1,j=i;
    while(j+1<n){const q=P[j+1];if(hav(sl/c,so/c,q.lat,q.lon)>R)break;sl+=q.lat;so+=q.lon;c++;j++;}
    if(P[j].t-P[i].t>=T){
      const id=stays.length;stays.push({i0:i,i1:j});for(let q=i;q<=j;q++)lab[q]=id;i=j+1;
    }else i++;
  }
  /* doprecyzowanie granic: na brzegach skupiska pomiary z ruchem (prędkość ≥ 3 km/h z odbiornika, ≥ 4 km/h liczona z położeń) należą już do przejścia/jazdy */
  for(const s of stays){
    const mv=i=>P[i].v>=(P[i].dop?3:4);
    while(s.i1>s.i0&&mv(s.i1)){lab[s.i1]=-1;s.i1--;}
    while(s.i0<s.i1&&mv(s.i0)){lab[s.i0]=-1;s.i0++;}}
  /* sąsiednie pobyty w tym samym miejscu (np. krótkie wyjście sygnału) łączone */
  for(let s=stays.length-1;s>0;s--){const A=stays[s-1],B=stays[s];const a=locOf(P,A.i0,A.i1),b=locOf(P,B.i0,B.i1);
    const between=P[B.i0].t-P[A.i1].t;
    if(hav(a.lat,a.lon,b.lat,b.lon)<=R&&between<=S.stay*60000&&maxDist(P,A.i1,B.i0,a)<=R*2){
      for(let q=A.i1+1;q<=B.i1;q++)lab[q]=s-1;A.i1=B.i1;stays.splice(s,1);for(let q=B.i0;q<n;q++)if(lab[q]>s-1)lab[q]--;}}
  return {lab,stays};
}
function maxDist(P,a,b,c){let m=0;for(let i=a;i<=b;i++)m=Math.max(m,hav(c.lat,c.lon,P[i].lat,P[i].lon));return m;}
/* położenie pobytu: mediana współrzędnych najdokładniejszej połowy pomiarów */
function locOf(P,a,b){let q=[];for(let i=a;i<=b;i++)q.push(P[i]);
  const acs=q.filter(p=>p.acc!=null).map(p=>p.acc);const am=median(acs);if(am!=null)q=q.filter(p=>p.acc==null||p.acc<=am);
  const lat=median(q.map(p=>p.lat)),lon=median(q.map(p=>p.lon));
  return {lat,lon,acc:am,spread:median(q.map(p=>hav(lat,lon,p.lat,p.lon))),n:b-a+1};}

function analyze(d){
  const raw=buildTrack(d);const {P,dropAcc,dropJump}=filterPts(raw);const n=P.length;
  const res={P,segs:[],events:[],dropAcc,dropJump,nRaw:raw.length,dop:0,watch:0};
  if(n<2)return res;
  speeds(P);res.dop=P.filter(p=>p.dop).length/n;res.watch=P.filter(p=>p.src==="watch").length/n;
  const {lab,stays}=findStays(P);
  /* etykiety punktów */
  const L=new Array(n);
  for(let i=0;i<n;i++)L[i]=lab[i]>=0?"stay:"+lab[i]:(P[i].v<S.haltV?"halt":P[i].v<S.walk?"walk":P[i].v<S.run?"run":"drive");
  /* ciągi */
  const GAP=10*60000;let segs=[];
  for(let i=0;i<n;i++){
    const last=segs[segs.length-1];
    if(last&&i>0&&P[i].t-P[i-1].t>GAP&&!(L[i]===L[i-1]&&L[i].startsWith("stay"))){
      segs.push({c:"gap",i0:i-1,i1:i,gap:true});segs.push({c:L[i],i0:i,i1:i});continue;}
    if(last&&last.c===L[i]&&!last.gap)last.i1=i;else segs.push({c:L[i],i0:i,i1:i});
  }
  const isStay=s=>s.c.startsWith("stay");const isMov=s=>!s.gap&&!isStay(s);
  const dur=s=>P[s.i1].t-P[s.i0].t+1000;
  const join=()=>{for(let q=segs.length-1;q>0;q--){const A=segs[q-1],B=segs[q];if(!A.gap&&!B.gap&&A.c===B.c){A.i1=B.i1;segs.splice(q,1);}}};
  /* zatrzymania krótsze od pobytu dołączane do sąsiedniego ruchu */
  const absorb=(pred,minMs)=>{let g=0;while(g++<200000){let mi=-1,md=Infinity;
      for(let q=0;q<segs.length;q++){const s=segs[q];if(!pred(s))continue;const dd=dur(s);if(dd<md){md=dd;mi=q;}}
      if(mi<0||md>=minMs)break;
      const A=segs[mi-1],B=segs[mi+1];const okA=A&&isMov(A)&&A.c!=="halt",okB=B&&isMov(B)&&B.c!=="halt";
      let tg=null;if(okA&&okB)tg=dur(A)>=dur(B)?A:B;else if(okA)tg=A;else if(okB)tg=B;
      if(!tg){segs[mi].c=segs[mi].c==="halt"?"walk":segs[mi].c;segs[mi].lock=true;continue;}
      if(tg===A)A.i1=segs[mi].i1;else B.i0=segs[mi].i0;segs.splice(mi,1);join();}};
  join();

  for(const s of segs)if(s.c==="halt")s.c="walk";
  join();
  absorb(s=>isMov(s)&&!s.lock,S.min*1000);
  /* chód/bieg wciśnięty między dwa odcinki jazdy bez pobytu = jazda w korku */
  for(let q=1;q<segs.length-1;q++){const s=segs[q];if((s.c==="walk"||s.c==="run")&&segs[q-1].c==="drive"&&segs[q+1].c==="drive"&&dur(s)<5*60000)s.c="drive";}
  /* „bieg” (7–14 km/h) to zwykle wolna jazda autem: ruszanie, parkowanie, manewry. Zostaje biegiem tylko,
     gdy trwa co najmniej 5 min, nie przekracza 20 km/h i nie przylega do jazdy */
  for(let q=0;q<segs.length;q++){const s=segs[q];if(s.c!=="run")continue;let mx=0;for(let i=s.i0;i<=s.i1;i++)mx=Math.max(mx,P[i].v);
    if(dur(s)<5*60000||mx>20||(segs[q-1]&&segs[q-1].c==="drive")||(segs[q+1]&&segs[q+1].c==="drive"))s.c="drive";}
  join();
  /* granice czasowe: koniec pobytu = ostatni pomiar w miejscu; ruch trwa do pierwszego pomiaru następnego pobytu */
  for(let q=0;q<segs.length;q++){const s=segs[q],nx=segs[q+1];
    s.t0=q===0?P[s.i0].t:segs[q-1].t1;

    if(s.gap)s.t0=P[s.i0].t;}

  /* korekty ręczne */
  applyEdits(d,segs,P);
  for(const s of segs)segStats(s,P,segs);

  res.events=detectEvents(P);
  for(const e of res.events){const s=segs.find(s=>e.t>=s.t0&&e.t<=s.t1);if(s){(s.ev=s.ev||{brake:0,accel:0,corner:0})[e.type]++;}}

function applyEdits(d,segs,P){
  const E=d.edits||{};if(!Object.keys(E).length)return;
  for(let q=0;q<segs.length;q++){const s=segs[q];const key=String(Math.round(s.t0/1000));const e=E[key];if(!e)continue;

    if(e.c&&e.c!==s.c){s.c=e.c;}
    if(s.c==="stay")Object.assign(s,locOf(P,s.i0,s.i1));}

function segStats(s,P,segs){
  if(s.gap){s.d=0;s.lat=P[s.i0].lat;s.lon=P[s.i0].lon;s.lat2=P[s.i1].lat;s.lon2=P[s.i1].lon;s.d=hav(s.lat,s.lon,s.lat2,s.lon2);return;}

    let dd=dt<=5?(a.v+b.v)/2/3.6*dt:hav(a.lat,a.lon,b.lat,b.lon);

  let nd=0;for(let i=s.i0;i<=s.i1;i++)if(P[i].dop)nd++;s.dopShare=nd/(s.i1-s.i0+1);
  s.d=d;s.max=mx;s.maxAt=mi;s.hiD=hiD;s.hiT=hi;

  s.lat2=B&&B.c==="stay"?B.lat:P[Math.min(s.i1+1,P.length-1)].lat;s.lon2=B&&B.c==="stay"?B.lon:P[Math.min(s.i1+1,P.length-1)].lon;

/* zdarzenia wg definicji iSharing: zmiana prędkości w ciągu 1 s, przy prędkości ≥ 24 km/h; tylko prędkość z odbiornika (Doppler) */
function detectEvents(P){
  const n=P.length,raw=[];
  const ok=i=>i>=0&&i<n&&P[i].dop&&(P[i].acc==null||P[i].acc<=15);
  const step=(i)=>{if(!ok(i)||!ok(i-1))return null;const dt=(P[i].t-P[i-1].t)/1000;if(dt<0.5||dt>1.6)return null;return (P[i].vr-P[i-1].vr)/dt;};
  for(let i=1;i<n;i++){const a=step(i);if(a==null)continue;
    if(Math.max(P[i].vr,P[i-1].vr)<S.evMin)continue;
    const nxt=step(i+1),prv=step(i-1);
    if(a<=-S.brake){ if(nxt!=null&&nxt>S.brake*0.6)continue; if(prv!=null&&prv>S.accel*0.6)continue; raw.push({type:"brake",i,a}); }
    else if(a>=S.accel){ if(nxt!=null&&nxt<-S.brake*0.6)continue; if(prv!=null&&prv<-S.brake*0.6)continue; raw.push({type:"accel",i,a}); }
  }
  /* zakręty: przyspieszenie boczne = prędkość × prędkość zmiany kierunku; położenia wygładzone (±2 s), cięciwy ok. 2 s i ≥ 10 m */
  const sm=P.map((p,i)=>{let la=0,lo=0,c=0;for(let q=Math.max(0,i-3);q<=Math.min(n-1,i+3);q++){if(Math.abs(P[q].t-p.t)<=2500){la+=P[q].lat;lo+=P[q].lon;c++;}}return{lat:la/c,lon:lo/c};});
  for(let i=2;i<n-2;i++){const p=P[i];if(p.v<20)continue;
    let a=i-1;while(a>0&&p.t-P[a].t<2000)a--;let b=i+1;while(b<n-1&&P[b].t-p.t<2000)b++;
    if(p.t-P[a].t>3000||P[b].t-p.t>3000)continue;
    if(hav(sm[a].lat,sm[a].lon,sm[i].lat,sm[i].lon)<10||hav(sm[i].lat,sm[i].lon,sm[b].lat,sm[b].lon)<10)continue;
    const h1=bearing(sm[a].lat,sm[a].lon,sm[i].lat,sm[i].lon),h2=bearing(sm[i].lat,sm[i].lon,sm[b].lat,sm[b].lon);
    const dt=(P[b].t-P[a].t)/2000;const lat=p.v/3.6*Math.abs(wrapPi(h2-h1))/dt;

    if(L){L.tEnd=P[r.i].t;L.cnt++;if(Math.abs(r.a)>Math.abs(L.a)){L.a=r.a;L.i=r.i;}L.i1=r.i;}
    else ev.push({type:r.type,i:r.i,i0:r.i,i1:r.i,a:r.a,tEnd:P[r.i].t,cnt:1});}
  return ev.filter(e=>e.type!=="corner"||e.cnt>=2||e.a>=S.corner*1.1).map(e=>{const p=P[e.i];
    const ms2=e.type==="corner"?e.a:Math.abs(e.a)/3.6;
    return {type:e.type,t:p.t,lat:p.lat,lon:p.lon,ms2,g:ms2/9.80665,kmhs:e.type==="corner"?null:Math.abs(e.a),

let CHW=null;
function drawChart(keep){
  const {P}=curA;const box=$("chart");if(P.length<2){box.innerHTML="";return;}
  const T0=P[0].t,T1=P[P.length-1].t;if(!keep||!CHW){CHW={t0:T0,t1:T1};chLast=null;}
  const minSpan=120000;CHW.t1=Math.min(T1,CHW.t1);CHW.t0=Math.max(T0,CHW.t0);if(CHW.t1-CHW.t0<minSpan){const m=(CHW.t0+CHW.t1)/2;CHW.t0=Math.max(T0,m-minSpan/2);CHW.t1=Math.min(T1,CHW.t0+minSpan);}
  const t0=CHW.t0,t1=CHW.t1;const W=1000,H=420,ml=64,mr=60,mt=34,mb=40;
  let a=0,b=P.length-1;while(a<b&&P[a+1].t<t0)a++;while(b>a&&P[b-1].t>t1)b--;
  let vmax=10;for(let i=a;i<=b;i++)vmax=Math.max(vmax,P[i].v);const st=[10,20,25,50,100].find(s=>vmax/s<=6)||50;const top=Math.ceil(vmax/st)*st;
  const X=t=>ml+(t-t0)/(t1-t0||1)*(W-ml-mr),Y=v=>mt+(1-v/top)*(H-mt-mb);
  let s=`<svg id="chSvg" viewBox="0 0 ${W} ${H}" style="touch-action:none;user-select:none">`;
  for(let v=0;v<=top;v+=st)s+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${ml-6}" y="${Y(v)+8}" text-anchor="end" class="axis">${v}</text>`;
  const span=(t1-t0)/3600000;const hs=[12,6,3,2,1,0.5,0.25,1/6,1/12,1/30,1/60].find(h=>span/h<=6&&span/h>=1.5)||1/60;
  const d0=new Date(t0);d0.setMinutes(0,0,0);for(let t=d0.getTime();t<=t1;t+=hs*3600000)if(t>=t0)s+=`<line x1="${X(t)}" x2="${X(t)}" y1="${mt}" y2="${H-mb}" stroke="var(--line)" stroke-dasharray="2 6"/><text x="${X(t)}" y="${H-8}" text-anchor="middle" class="axis">${fmtT(t)}</text>`;
  s+=`<text x="${ml}" y="24" class="axis">km/h</text>`;
  const stepI=Math.max(1,Math.floor((b-a)/2500));
  let run=[],key=null;const fl=()=>{if(run.length>1)s+=`<polyline fill="none" stroke="${key}" stroke-width="3" points="${run.join(" ")}"/>`;};
  for(let i=a;i<=b;i+=stepI){const p=P[i];if(i>a&&p.t-P[Math.max(a,i-stepI)].t>60000*stepI){fl();run=[];key=null;}
    const c=VCOL[vbin(p.v)];if(c!==key){fl();run=run.length?[run[run.length-1]]:[];key=c;}run.push(X(p.t).toFixed(1)+","+Y(p.v).toFixed(1));}
  fl();
  const hr=[];for(let i=a;i<=b;i++)if(P[i].hr!=null)hr.push(P[i]);
  if(hr.length>1){const hmin=Math.floor(Math.min(...hr.map(p=>p.hr))/10)*10,hmax=Math.ceil(Math.max(...hr.map(p=>p.hr))/10)*10||200;
    const YH=h=>mt+(1-(h-hmin)/(hmax-hmin||1))*(H-mt-mb);let pts=[];
    for(let i=0;i<hr.length;i++){if(i>0&&hr[i].t-hr[i-1].t>60000){if(pts.length>1)s+=`<polyline fill="none" stroke="#d6336c" stroke-width="2" stroke-dasharray="6 4" points="${pts.join(" ")}"/>`;pts=[];}pts.push(X(hr[i].t).toFixed(1)+","+YH(hr[i].hr).toFixed(1));}
    if(pts.length>1)s+=`<polyline fill="none" stroke="#d6336c" stroke-width="2" stroke-dasharray="6 4" points="${pts.join(" ")}"/>`;
    s+=`<text x="${W-mr+6}" y="${YH(hmax)+8}" class="axis" fill="#d6336c">${hmax}</text><text x="${W-mr+6}" y="${YH(hmin)}" class="axis">${hmin}</text><text x="${W-mr}" y="24" class="axis" text-anchor="end">tętno</text>`;}
  for(const e of curA.events){if(e.t<t0||e.t>t1)continue;const p=P.find(q=>q.t===e.t);if(p)s+=`<circle cx="${X(e.t)}" cy="${Y(p.v)}" r="8" fill="${EVC[e.type]}" stroke="#fff" stroke-width="2"/>`;}
  /* kursor */
  s+=`<g id="chCur" style="display:none"><line id="chCl" y1="${mt}" y2="${H-mb}" stroke="#000" stroke-width="2"/><circle id="chCd" r="7" fill="#fff" stroke="#000" stroke-width="3"/>
    <rect id="chCb" y="2" height="30" rx="6" fill="#000" opacity=".85"/><text id="chCt" y="24" fill="#fff" font-size="20" font-weight="700" text-anchor="middle"></text></g>`;
  const zoomed=t1-t0<T1-T0-1000;
  box.innerHTML=`<div class="row" style="margin-bottom:4px"><button class="sm" id="chP" title="powiększ">＋</button><button class="sm" id="chM" title="pomniejsz">－</button><button class="sm" id="chA">cały dzień</button><span class="note grow" id="chI">${fmtT(t0)}–${fmtT(t1)} · przesuń palcem po wykresie, aby zobaczyć godzinę i prędkość; dwa palce – powiększanie</span></div>`+s+"</svg>"+
    (zoomed?`<input id="chR" type="range" min="0" max="1000" value="${Math.round((t0-T0)/((T1-T0)-(t1-t0))*1000)}" style="width:100%">`:"");
  const zoomAt=(f,tc)=>{const sp=(CHW.t1-CHW.t0)*f;tc=tc??(CHW.t0+CHW.t1)/2;const r=(tc-CHW.t0)/(CHW.t1-CHW.t0);CHW.t0=tc-sp*r;CHW.t1=CHW.t0+sp;
    if(CHW.t0<T0){CHW.t1+=T0-CHW.t0;CHW.t0=T0;}if(CHW.t1>T1){CHW.t0-=CHW.t1-T1;CHW.t1=T1;}drawChart(true);};
  $("chP").onclick=()=>zoomAt(0.5,chLast);$("chM").onclick=()=>zoomAt(2,chLast);$("chA").onclick=()=>{CHW=null;drawChart();};
  if($("chR"))$("chR").oninput=e=>{const sp=CHW.t1-CHW.t0;CHW.t0=T0+(T1-T0-sp)*e.target.value/1000;CHW.t1=CHW.t0+sp;drawChart(true);};
  const svg=$("chSvg");const vx=cx=>{const r=svg.getBoundingClientRect();return (cx-r.left)/r.width*W;};
  const tOf=x=>t0+(Math.min(W-mr,Math.max(ml,x))-ml)/(W-ml-mr)*(t1-t0);
  const cursor=t=>{let lo=0,hi=P.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(P[m].t<=t)lo=m;else hi=m;}const p=Math.abs(P[lo].t-t)<=Math.abs(P[hi].t-t)?P[lo]:P[hi];
    chLast=p.t;const x=X(p.t),y=Y(p.v);$("chCur").style.display="";$("chCl").setAttribute("x1",x);$("chCl").setAttribute("x2",x);$("chCd").setAttribute("cx",x);$("chCd").setAttribute("cy",y);
    const txt=`${fmtTs(p.t)} · ${fmtV(p.v)}${p.hr!=null?" · ♥ "+nf0.format(p.hr):""}`;const w=txt.length*11+20;const bx=Math.min(W-w-2,Math.max(2,x-w/2));
    $("chCb").setAttribute("x",bx);$("chCb").setAttribute("width",w);$("chCt").setAttribute("x",bx+w/2);$("chCt").textContent=txt;
    if(window.__seek)window.__seek(p.t);};
  if(chLast!=null&&chLast>=t0&&chLast<=t1)cursor(chLast);
  const pts=new Map();let pinch=null;
  svg.onpointerdown=e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,e.clientX);
    if(pts.size===2){const [x1,x2]=[...pts.values()];pinch={d:Math.abs(x1-x2)||1,tc:tOf(vx((x1+x2)/2)),w0:CHW.t0,w1:CHW.t1};}else cursor(tOf(vx(e.clientX)));};
  svg.onpointermove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e.clientX);
    if(pts.size===2&&pinch){const [x1,x2]=[...pts.values()];const f=pinch.d/(Math.abs(x1-x2)||1);const sp=Math.min(T1-T0,Math.max(minSpan,(pinch.w1-pinch.w0)*f));
      const r=(pinch.tc-pinch.w0)/(pinch.w1-pinch.w0);CHW.t0=pinch.tc-sp*r;CHW.t1=CHW.t0+sp;if(CHW.t0<T0){CHW.t1+=T0-CHW.t0;CHW.t0=T0;}if(CHW.t1>T1){CHW.t0-=CHW.t1-T1;CHW.t1=T1;}
      const sv=$("chSvg");if(sv)sv.style.opacity=".55";$("chI").textContent=`${fmtT(CHW.t0)}–${fmtT(CHW.t1)} · puść palce, aby powiększyć`;}
    else if(pts.size===1)cursor(tOf(vx(e.clientX)));};
  svg.onpointerup=svg.onpointercancel=e=>{pts.delete(e.pointerId);if(pts.size<2&&pinch){pinch=null;pts.clear();drawChart(true);}};
  svg.onwheel=e=>{e.preventDefault();zoomAt(e.deltaY<0?0.8:1.25,tOf(vx(e.clientX)));};
}

/* dotknięcie trasy: godzina i prędkość w najbliższym punkcie pomiaru */
function trackClick(e){
  if(!curA||!MAP)return;const P=curA.P;if(!P.length)return;
  const cp=e.containerPoint;let best=-1,bd=Infinity;
  for(let i=0;i<P.length;i++){const q=MAP.latLngToContainerPoint([P[i].lat,P[i].lon]);const d=(q.x-cp.x)**2+(q.y-cp.y)**2;if(d<bd){bd=d;best=i;}}
  if(best<0||bd>45*45)return;
  const p=P[best];const s=curA.segs.find(s=>!s.gap&&p.t>=s.t0&&p.t<=s.t1);
  const row=(k,v)=>`<tr><td style="color:#666;padding-right:8px">${k}</td><td><b>${v}</b></td></tr>`;

    (p.acc!=null?row("Dokładność GPS","± "+nf0.format(p.acc)+" m"):"")+
    (p.ele!=null?row("Wysokość",nf0.format(p.ele)+" m n.p.m."):"")+

/* odtwarzanie */
function setupPlay(){
  const {P}=curA;if(P.length<2)return;const t0=P[0].t,t1=P[P.length-1].t;const rng=$("pRng");let playing=false,last=0,tt=t0;
  const at=t=>{let lo=0,hi=P.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(P[m].t<=t)lo=m;else hi=m;}const a=P[lo],b=P[hi];const f=b.t>a.t?Math.min(1,Math.max(0,(t-a.t)/(b.t-a.t))):0;
    return {lat:a.lat+(b.lat-a.lat)*f,lon:a.lon+(b.lon-a.lon)*f,v:a.v+(b.v-a.v)*f,gap:b.t-a.t>15000};};
  const upd=()=>{const p=at(tt);$("pInfo").textContent=fmtTs(tt)+" · "+(p.gap?"brak pomiaru":fmtV(p.v));rng.value=Math.round((tt-t0)/(t1-t0)*1000);
    if(MAP){if(!PLAYM)PLAYM=L.circleMarker([p.lat,p.lon],{radius:9,color:"#000",weight:3,fillColor:"#fff",fillOpacity:1}).addTo(MAP);else PLAYM.setLatLng([p.lat,p.lon]);}};
  /* kropka odtwarzania zawsze na środku mapy – przesuwa się mapa */
  const center=()=>{if(MAP&&PLAYM)MAP.setView(PLAYM.getLatLng(),MAP.getZoom(),{animate:false});};
  PLAYM=null;rng.oninput=()=>{tt=t0+(t1-t0)*rng.value/1000;upd();center();};
  window.__seek=t=>{if(playing)return;tt=t;upd();center();};
  const loop=ts=>{if(!playing)return;const dt=last?ts-last:0;last=ts;tt+=dt*(+$("pSpd").value);if(tt>=t1){tt=t1;playing=false;$("pBtn").textContent="▶";}
    upd();center();if(playing)requestAnimationFrame(loop);};
  $("pBtn").onclick=()=>{playing=!playing;$("pBtn").textContent=playing?"⏸":"▶";last=0;if(tt>=t1)tt=t0;if(playing)requestAnimationFrame(loop);};
  upd();
}

/* ================= połączenia telefoniczne (SMS Backup & Restore, calls-*.xml) ================= */
const CALLN={1:"Przychodzące",2:"Wychodzące",3:"Nieodebrane",4:"Poczta głosowa",5:"Odrzucone",6:"Zablokowane",7:"Odebrane na innym urządzeniu"};
const CALLC={1:"#2f9e44",2:"#1971c2",3:"#868e96",4:"#868e96",5:"#868e96",6:"#868e96",7:"#2f9e44"};
let CALLM=[];
function parseCalls(txt){
  const x=new DOMParser().parseFromString(txt,"text/xml");if(x.getElementsByTagName("parsererror").length)throw new Error("plik połączeń jest uszkodzony");
  const out=[];for(const e of x.getElementsByTagName("call")){const t=+e.getAttribute("date");if(!isFinite(t))continue;
    const nm=e.getAttribute("contact_name");out.push({t,d:+e.getAttribute("duration")||0,ty:+e.getAttribute("type")||0,n:e.getAttribute("number")||"",nm:nm&&nm!=="(Unknown)"&&nm!=="null"?nm:""});}
  return out.sort((a,b)=>a.t-b.t);}
/* położenie w chwili rozpoczęcia połączenia: interpolacja między pomiarami (przerwa ≤ 15 min) albo najbliższy pomiar (≤ 10 min) */
function posAt(P,t){if(!P.length)return null;let lo=0,hi=P.length-1;
  if(t<=P[0].t)return t>=P[0].t-600000?{lat:P[0].lat,lon:P[0].lon,dt:P[0].t-t}:null;
  if(t>=P[hi].t)return t<=P[hi].t+600000?{lat:P[hi].lat,lon:P[hi].lon,dt:t-P[hi].t}:null;
  while(hi-lo>1){const m=(lo+hi)>>1;if(P[m].t<=t)lo=m;else hi=m;}
  const a=P[lo],b=P[hi],g=b.t-a.t;
  if(g<=900000){const f=g?(t-a.t)/g:0;return{lat:a.lat+(b.lat-a.lat)*f,lon:a.lon+(b.lon-a.lon)*f,dt:Math.min(t-a.t,b.t-t)};}
  const n=t-a.t<b.t-t?a:b;return Math.abs(n.t-t)<=600000?{lat:n.lat,lon:n.lon,dt:Math.abs(n.t-t)}:null;}
function dayCalls(k,P,segs){let nr=0;const stayNr=new Map();segs.forEach(s=>{if(s.c==="stay")stayNr.set(s,++nr);});
  return CALLS.filter(c=>dateKey(c.t)===k).map(c=>{const p=posAt(P,c.t);const s=segs.find(s=>c.t>=s.t0&&c.t<=s.t1);
    return Object.assign({},c,p?{lat:p.lat,lon:p.lon,dt:p.dt}:{lat:null,lon:null},{seg:s?(s.c==="stay"?(stayKind(s.lat,s.lon).t==="POBYT"?"Pobyt ":"Postój ")+stayNr.get(s):s.gap?"brak danych GPS":CLS[s.c].n):""});});}

const SCOPES="https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file";

function getToken(interactive){
  return new Promise((res,rej)=>{
    if(tokOk())return res(TOK.access_token);
    if(!D.clientId)return rej(new Error("brak identyfikatora klienta OAuth (przycisk Dysk)"));
    if(!(window.google&&google.accounts&&google.accounts.oauth2))return rej(new Error("logowanie Google niedostępne (brak internetu lub strona nie przez https://)"));
    if(!interactive)return rej(new Error("wymagane zalogowanie – przycisk „Synchronizuj”"));
    const tc=google.accounts.oauth2.initTokenClient({client_id:D.clientId,scope:SCOPES,
      callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));
        TOK={access_token:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000};try{localStorage.setItem("osczasu-tok",JSON.stringify(TOK));}catch(e){}driveUI();res(TOK.access_token);},
      error_callback:e=>rej(new Error(e&&e.type==="popup_closed"?"okno logowania zamknięte":(e&&(e.message||e.type))||"logowanie przerwane"))});
    tc.requestAccessToken({prompt:""});
  });
}
/* odczyt Dysku przez własny program Google Apps Script – bez logowania i bez wygasania po godzinie */
const proxyOk=()=>!!(D.proxy&&D.pkey);
async function gproxy(url){const rel=url.startsWith("https://www.googleapis.com/drive/v3/")?url.slice(36):url;if(rel.startsWith("http"))return null;
  const x=await fetch(D.proxy+"?k="+encodeURIComponent(D.pkey)+"&p="+encodeURIComponent(rel),{signal:AbortSignal.timeout(60000)});
  if(!x.ok)throw new Error("program Dysku: "+x.status);const o=await x.json();
  const bin=atob(o.b64||"");const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  const r=new Response(u8,{status:o.s||200,headers:{"Content-Type":o.ct||"application/octet-stream"}});
  if(!r.ok){let t="";try{t=(await r.clone().json()).error.message;}catch(e){}throw new Error("Dysk: "+r.status+(t?" – "+t:""));}
  return r;}
async function gapi(url,opt={},interactive){

async function scanVisits(o,Rm){const out=$("fOut");const ks=Object.keys(INDEX.days).sort().reverse();const V=[];

    for(let i=0;i<P.length;i++){const p=P[i];if(Math.abs(p.lat-o.lat)>dLat||Math.abs(p.lon-o.lon)>dLon){if(v&&p.t-v.t1>600000){V.push(v);v=null;}continue;}

function gapWarn(k,A){const P=A.P;if(!P.length)return"";let h="";
  if(k===dateKey(Date.now())){const age=Date.now()-P[P.length-1].t;
    if(age>45*60000)h+=`<div class="card" style="border:2px solid #c92a2a"><b style="color:#c92a2a">⚠ Brak nowych danych od ${fmtDur(age/1000)}</b> (ostatni zapis ${fmtTs(P[P.length-1].t)})<br>
      <span class="note">Możliwe przyczyny: GPSLogger zatrzymany albo uśpiony przez telefon, telefon bez internetu (plik wysyłany jest co 30 min), telefon wyłączony lub nie zsynchronizowano jeszcze aplikacji (przycisk „Synchronizuj”). Sprawdź, czy GPSLogger zapisuje.</span></div>`;}
  const G=A.segs.filter(s=>s.gap&&s.t1-s.t0>30*60000);
  if(G.length)h+=`<div class="card" style="border:2px solid #e8590c"><b style="color:#e8590c">⚠ Przerwy w zapisie ponad 30 min:</b> ${G.map(s=>`${fmtT(s.t0)}–${fmtT(s.t1)} (${fmtDur((s.t1-s.t0)/1000)})`).join(", ")}<br><span class="note">W tym czasie położenie nie jest znane.</span></div>`;
  return h;}

/* ================= 3. raport dnia ================= */
function dayReport(k){const lines=[];const A=curA;
  lines.push("OŚ CZASU – "+dayLabel(k));
  const agg={};for(const s of A.segs){if(s.gap)continue;agg[s.c]=agg[s.c]||{t:0,d:0,n:0};agg[s.c].t+=(s.t1-s.t0)/1000;agg[s.c].d+=s.d||0;agg[s.c].n++;}
  const sm=[];if(agg.drive)sm.push(`jazda ${fmtKm(agg.drive.d)} (${fmtDur(agg.drive.t)}, przejazdów: ${agg.drive.n})`);if(agg.walk)sm.push(`chód ${fmtKm(agg.walk.d)}`);if(agg.stay)sm.push(`pobyty: ${agg.stay.n}`);
  if(sm.length)lines.push("Podsumowanie: "+sm.join(", "));lines.push("");
  let pend=false;
  document.querySelectorAll("#tl>li").forEach(li=>{const s=A.segs[+li.dataset.q];if(!s)return;const col=li.children[2];if(!col)return;
    const parts=[...col.children].filter(e=>!e.classList.contains("act")&&!e.classList.contains("badge")).map(e=>e.innerText.trim()).filter(Boolean);
    if(parts.some(t=>/ustalanie|szukanie adresu/.test(t)))pend=true;
    lines.push(`${fmtTs(s.t0)}–${fmtTs(s.t1)}  ${parts[0]||""}`);for(const t of parts.slice(1))for(const l of t.split("\n"))if(l.trim())lines.push("    "+l.trim());lines.push("");});
  lines.push("Źródło: zapis GPS z telefonu"+(A.watch>0?" i zegarka":"")+"; adresy, miejscowości i drogi: OpenStreetMap. Czas polski.");
  const txt=lines.join("\n");
  dlg(`<h2>Raport dnia</h2>${pend?`<p class="note" style="color:#c92a2a">Część adresów lub opisów tras jeszcze się uzupełnia – zamknij, odczekaj chwilę i otwórz raport ponownie.</p>`:""}
    <textarea id="rT" readonly style="width:100%;height:50vh;font-family:monospace;font-size:12px">${esc(txt)}</textarea>
    <div class="row" style="margin-top:8px"><button id="rC" class="pri">Kopiuj</button><button id="rP">PDF / drukuj</button><button id="rF">Zapisz plik</button>${driveReady()?'<button id="rD">Na Dysk</button>':""}<span class="grow"></span><button id="rX">Zamknij</button></div>`);
  $("rX").onclick=closeDlg;
  $("rC").onclick=async()=>{try{await navigator.clipboard.writeText(txt);msg("Raport skopiowany.");}catch(e){$("rT").select();document.execCommand("copy");msg("Raport skopiowany.");}};
  $("rF").onclick=()=>out(`raport-${k}.txt`,"\ufeff"+txt,"text/plain",false);
  if($("rD"))$("rD").onclick=()=>out(`raport-${k}.txt`,"\ufeff"+txt,"text/plain",true).catch(e=>msg("Dysk: "+e.message,true));
  $("rP").onclick=()=>{const w=window.open("","_blank");if(!w){msg("Przeglądarka zablokowała nowe okno.",true);return;}
    w.document.write(`<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><title>Raport ${k}</title><style>body{font-family:Arial,sans-serif;font-size:12px;margin:16mm}pre{white-space:pre-wrap;font-family:inherit}</style></head><body><pre>${esc(txt)}</pre></body></html>`);w.document.close();setTimeout(()=>{try{w.focus();w.print();}catch(e){}},400);};}

/* ================= 4. moje miejsca: rodzaje i zestawienie ================= */
const PKIND=["Inne","Dom","Praca","Służba","OSP / remiza","Rodzina","Znajomi","Sklep / usługi","Zdrowie"];
async function placeSummary(m,rows){const el=$("plSum");if(!el)return;const agg=new Map(),un=[];
  for(const k of rows){const d=await loadDay(k);if(!d)continue;const A=analyzeDay(d);
    for(const s of A.segs){if(s.c!=="stay")continue;const pl=placeAt(s.lat,s.lon);const dt=(s.t1-s.t0)/1000;
      if(pl){const a=agg.get(pl.p.id)||{p:pl.p,t:0,n:0,days:new Set()};a.t+=dt;a.n++;a.days.add(k);agg.set(pl.p.id,a);}
      else{let c=un.find(c=>hav(c.lat,c.lon,s.lat,s.lon)<=100);if(!c){c={lat:s.lat,lon:s.lon,t:0,n:0,days:new Set()};un.push(c);}c.t+=dt;c.n++;c.days.add(k);}}}
  if(!$("plSum"))return;
  const L=[...agg.values()].sort((a,b)=>b.t-a.t);const byK={};for(const a of L){const kk=a.p.kind||"Inne";byK[kk]=(byK[kk]||0)+a.t;}
  let h=`<b>Czas w moich miejscach</b>`;
  if(L.length)h+=`<div class="scroll"><table><tr><th>Miejsce</th><th>Rodzaj</th><th>Czas</th><th>Wizyty</th><th>Dni</th></tr>${L.map(a=>`<tr><td>${esc(a.p.name)}</td><td>${esc(a.p.kind||"Inne")}</td><td>${fmtDur(a.t)}</td><td>${a.n}</td><td>${a.days.size}</td></tr>`).join("")}</table></div>
    <p class="note">Wg rodzaju: ${Object.entries(byK).map(([kk,t])=>`${esc(kk)} ${fmtDur(t)}`).join(" · ")}</p>`;
  else h+=`<p class="note">Brak nazwanych miejsc. Nazwij miejsce przyciskiem „Nazwij miejsce” przy pobycie albo poniżej.</p>`;
  const U=un.filter(c=>c.t>=3600).sort((a,b)=>b.t-a.t).slice(0,6);
  if(U.length){h+=`<p style="margin-top:10px"><b>Często odwiedzane, bez nazwy</b></p>`+U.map((c,i)=>`<div class="row" style="margin:4px 0"><span class="grow"><span data-u="${i}">…</span> <span class="note">· ${fmtDur(c.t)}, wizyt ${c.n}, dni ${c.days.size}</span></span><button class="sm" data-n="${i}">Nazwij</button></div>`).join("");}
  el.innerHTML=h;
  U.forEach((c,i)=>{const e=el.querySelector(`[data-u="${i}"]`);if(e)fillAddr(e,c.lat,c.lon);});
  el.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const c=U[+b.dataset.n];namePlace({lat:c.lat,lon:c.lon,spread:30});});}
</script>
